name: quick-demo-swebench
task_workspace_root: ./examples/quick_demo/workspace
allowed_write_paths:
  - ./examples/quick_demo/workspace
denied_write_paths:
  - /etc
  - /usr
  - ~/.ssh
allowed_env_vars:
  - PATH
  - PYTHONPATH
  - PYTHONIOENCODING
allow_outbound_network: false
max_memory_mb: 4096
timeout_seconds: 60
prevent_ghost_processes: true
track_shared_memory: true
